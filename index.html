<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Database Mid-Term Quiz (300 MCQs) — Created by Muhammad Waleed</title>
  <style>
    :root {
      --bg-color: #f3f5f9;
      --surface-color: #ffffff;
      --surface-alt: #f8fafc;
      --text-primary: #1e293b;
      --text-secondary: #475569;
      --border-color: #e2e8f0;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --correct-bg: #dcfce7;
      --correct-border: #16a34a;
      --correct-text: #14532d;
      --wrong-bg: #fee2e2;
      --wrong-border: #dc2626;
      --wrong-text: #7f1d1d;
      --shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
      --header-bg: rgba(255, 255, 255, 0.92);
    }

    body.dark-mode {
      --bg-color: #0b1120;
      --surface-color: #111827;
      --surface-alt: #1e293b;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --border-color: #334155;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --correct-bg: rgba(22, 163, 74, 0.22);
      --correct-border: #22c55e;
      --correct-text: #bbf7d0;
      --wrong-bg: rgba(220, 38, 38, 0.22);
      --wrong-border: #ef4444;
      --wrong-text: #fecaca;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
      --header-bg: rgba(17, 24, 39, 0.92);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      line-height: 1.55;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* Sticky Top Navbar */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--header-bg);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      padding: 14px 20px;
      box-shadow: var(--shadow);
    }

    .navbar-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand h1 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .brand .author {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
    }

    .stats-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .stat-pill {
      background: var(--surface-alt);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .stat-pill.correct {
      color: #16a34a;
      border-color: rgba(22, 163, 74, 0.4);
    }

    .stat-pill.wrong {
      color: #dc2626;
      border-color: rgba(220, 38, 38, 0.4);
    }

    body.dark-mode .stat-pill.correct { color: #4ade80; }
    body.dark-mode .stat-pill.wrong { color: #f87171; }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button.btn {
      cursor: pointer;
      border: 1px solid var(--border-color);
      background: var(--surface-color);
      color: var(--text-primary);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    button.btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    button.btn-primary {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    button.btn-primary:hover {
      background: var(--accent-hover);
      color: #ffffff;
    }

    /* Progress Bar */
    .progress-wrap {
      max-width: 960px;
      margin: 10px auto 0;
      height: 6px;
      background: var(--border-color);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #10b981);
      transition: width 0.3s ease;
    }

    /* Search & Filter Toolbar */
    .container {
      max-width: 960px;
      margin: 24px auto 60px;
      padding: 0 16px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      background: var(--surface-color);
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
    }

    .search-input {
      flex: 1;
      min-width: 220px;
      padding: 9px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--surface-alt);
      color: var(--text-primary);
      font-size: 0.92rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .filter-select {
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--surface-alt);
      color: var(--text-primary);
      font-size: 0.9rem;
      cursor: pointer;
    }

    /* MCQ Card */
    .mcq-card {
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 20px 22px;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
      transition: transform 0.15s ease, border-color 0.2s ease;
    }

    .mcq-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 10px;
    }

    .q-badge {
      display: inline-block;
      background: var(--surface-alt);
      color: var(--accent);
      border: 1px solid var(--border-color);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 6px;
    }

    .q-status {
      font-size: 0.82rem;
      font-weight: 700;
    }

    .q-status.ok { color: #16a34a; }
    .q-status.bad { color: #dc2626; }
    body.dark-mode .q-status.ok { color: #4ade80; }
    body.dark-mode .q-status.bad { color: #f87171; }

    .question-text {
      font-size: 1.04rem;
      font-weight: 600;
      margin-bottom: 15px;
      color: var(--text-primary);
    }

    .options-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .option-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      text-align: left;
      padding: 12px 15px;
      border-radius: 10px;
      border: 1.5px solid var(--border-color);
      background: var(--surface-alt);
      color: var(--text-primary);
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--surface-color);
      transform: translateX(3px);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .opt-key {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: var(--surface-color);
      border: 1px solid var(--border-color);
      font-weight: 700;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .opt-text {
      flex: 1;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.91rem;
    }

    .opt-icon {
      font-weight: 700;
      font-size: 1rem;
      flex-shrink: 0;
    }

    /* Instant Feedback States */
    .option-btn.correct-choice {
      background: var(--correct-bg);
      border-color: var(--correct-border);
      color: var(--correct-text);
    }

    .option-btn.correct-choice .opt-key {
      background: var(--correct-border);
      color: #ffffff;
      border-color: var(--correct-border);
    }

    .option-btn.wrong-choice {
      background: var(--wrong-bg);
      border-color: var(--wrong-border);
      color: var(--wrong-text);
    }

    .option-btn.wrong-choice .opt-key {
      background: var(--wrong-border);
      color: #ffffff;
      border-color: var(--wrong-border);
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 28px 16px;
      border-top: 1px solid var(--border-color);
      background: var(--surface-color);
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    footer strong {
      color: var(--accent);
    }

    /* Scroll to top button */
    #scrollTopBtn {
      position: fixed;
      bottom: 22px;
      right: 22px;
      padding: 10px 14px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      border: none;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow);
      display: none;
      z-index: 999;
    }

    @media (max-width: 640px) {
      .navbar-inner {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="navbar-inner">
      <div class="brand">
        <h1>Database Mid-Term Interactive Quiz (300 MCQs)</h1>
        <div class="author">Created by Muhammad Waleed</div>
      </div>

    </div>

    <div id="quizContainer"></div>
  </main>

  <footer>
    Database Systems Mid-Term Preparation Quiz &bull; <strong>Created by Muhammad Waleed</strong>
  </footer>

 "q": "Which category and statement correctly create a new table ArchiveRecords with an integer primary key?", "options": {"A": "DML; INSERT TABLE ArchiveRecords;", "B": "DDL; CREATE TABLE ArchiveRecords (ArchiveID INT PRIMARY KEY);", "C": "DQL; SELECT TABLE ArchiveRecords;", "D": "DCL; UPDATE TABLE ArchiveRecords;"}, "answer": "B"}, {"id": 9, "q": "Which command category and statement add a new row to Students without changing its structure?", "options": {"A": "DDL; ALTER TABLE Students ADD ROW;", "B": "DML; INSERT INTO Students (StudentID, Name) VALUES (1, 'Sample');", "C": "DCL; GRANT ROW ON Students;", "D": "DDL; CREATE ROW Students;"}, "answer": "B"}, {"id": 10, "q": "Which condition searches for Students whose Name begins with 'A'?", "options": {"A": "Name BETWEEN 'A' AND 'Z'", "B": "Name LIKE 'A%'", "C": "Name = '%A'", "D": "Name > 'A%'"}, "answer": "B"}, {"id": 11, "q": "What is the correct SQL statement to retrieve Patients where Age > 50?", "options": {"A": "SELECT Patients HAVING Age > 50;", "B": "SELECT * FROM Patients ORDER BY Age > 50;", "C": "SELECT * FROM Patients WHERE Age > 50;", "D": "UPDATE Patients SET Age > 50;"}, "answer": "C"}, {"id": 12, "q": "Which query correctly uses a column alias RecordName for the PatientName column in Patients?", "options": {"A": "RENAME PatientName TO RecordName FROM Patients;", "B": "SELECT RecordName = PatientName FROM Patients;", "C": "ALTER Patients PatientName AS RecordName;", "D": "SELECT PatientName AS RecordName FROM Patients;"}, "answer": "D"}, {"id": 13, "q": "Which clause arranges Patients records from highest to lowest Age?", "options": {"A": "GROUP BY Age ASC", "B": "WHERE Age DESC", "C": "ORDER BY Age DESC", "D": "SORT Age HIGH"}, "answer": "C"}, {"id": 14, "q": "Which aggregate expression shows the number of records in Patients including all rows?", "options": {"A": "COUNT(*)", "B": "SUM(*)", "C": "AVG(*)", "D": "MAX(*)"}, "answer": "A"}, {"id": 15, "q": "Which query calculates the average Age for all ons": {"A": "AND", "B": "OR", "C": "NOT", "D": "BETWEEN"}, "answer": "B"}, {"id": 293, "q": "Which logical operator reverses a condition?", "options": {"A": "AND", "B": "OR", "C": "NOT", "D": "AS"}, "answer": "C"}, {"id": 294, "q": "Which keyword limits the number of returned records in SQL Server?", "options": {"A": "LIMIT", "B": "FIRST", "C": "ROWS", "D": "TOP"}, "answer": "D"}, {"id": 295, "q": "Which SQL operator searches for a specific text pattern?", "options": {"A": "LIKE", "B": "BETWEEN", "C": "JOIN", "D": "ORDER BY"}, "answer": "A"}, {"id": 296, "q": "What does the percent (%) wildcard represent in SQL LIKE?", "options": {"A": "Exactly one character", "B": "Zero or more characters", "C": "Only numbers", "D": "A table name"}, "answer": "B"}, {"id": 297, "q": "What does the underscore (_) wildcard represent in SQL LIKE?", "options": {"A": "Multiple characters", "B": "All records", "C": "Exactly one character", "D": "A database name"}, "answer": "C"}, {"id": 298, "q": "Which operator checks whether a value falls within a specified range?", "options": {"A": "LIKE", "B": "JOIN", "C": "ORDER BY", "D": "BETWEEN"}, "answer": "D"}, {"id": 299, "q": "Which SQL Server stored procedure can rename a table?", "options": {"A": "sp_rename", "B": "sp_delete", "C": "sp_update", "D": "sp_create"}, "answer": "A"}, {"id": 300, "q": "Which SQL Server stored procedure can rename a column?", "options": {"A": "sp_select", "B": "sp_rename", "C": "sp_insert", "D": "sp_order"}, "answer": "B"}];

    const userAnswers = {}; // { id: { selected: 'A', isCorrect: true } }

    const quizContainer = document.getElementById('quizContainer');
    const attemptedEl = document.getElementById('attemptedCount');
    const correctEl = document.getElementById('correctCount');
    const wrongEl = document.getElementById('wrongCount');
    const progressFill = document.getElementById('progressFill');
    const searchInput = document.getElementById('searchInput');
    const filterSelect = document.getElementById('filterSelect');
    const darkModeToggle = document.getElementById('darkModeToggle');
    const resetQuizBtn = document.getElementById('resetQuizBtn');
    const scrollTopBtn = document.getElementById('scrollTopBtn');

    function escapeHTML(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function updateStats() {
      const entries = Object.values(userAnswers);
      const attempted = entries.length;
      const correct = entries.filter(e => e.isCorrect).length;
      const wrong = attempted - correct;

      attemptedEl.textContent = attempted;
      correctEl.textContent = correct;
      wrongEl.textContent = wrong;
      progressFill.style.width = ((attempted / quizData.length) * 100).toFixed(1) + '%';
    }

    function renderQuiz() {
      const query = searchInput.value.trim().toLowerCase();
      const filter = filterSelect.value;

      quizContainer.innerHTML = '';
      const fragment = document.createDocumentFragment();

      quizData.forEach(item => {
        const state = userAnswers[item.id];

        // Filter check
        if (filter === 'unanswered' && state) return;
        if (filter === 'correct' && (!state || !state.isCorrect)) return;
        if (filter === 'wrong' && (!state || state.isCorrect)) return;

        // Search check
        if (query) {
          const haystack = (item.q + ' ' + Object.values(item.options).join(' ')).toLowerCase();
          if (!haystack.includes(query)) return;
        }

        const card = document.createElement('div');
        card.className = 'mcq-card';
        card.id = 'mcq-' + item.id;

        let statusHtml = '';
        if (state) {
          statusHtml = state.isCorrect
            ? '<span class="q-status ok">✔ Correct!</span>'
            : `<span class="q-status bad">✘ Wrong (Correct: ${item.answer})</span>`;
        }

        let optionsHtml = '';
        ['A', 'B', 'C', 'D'].forEach(key => {
          let btnClass = 'option-btn';
          let icon = '';
          const disabledAttr = state ? 'disabled' : '';

          if (state) {
            if (key === item.answer) {
              btnClass += ' correct-choice';
              icon = '✔';
            } else if (key === state.selected && !state.isCorrect) {
              btnClass += ' wrong-choice';
              icon = '✘';
            }
          }

          optionsHtml += `
            <button type="button" class="${btnClass}" data-id="${item.id}" data-opt="${key}" ${disabledAttr}>
              <span class="opt-key">${key}</span>
              <span class="opt-text">${escapeHTML(item.options[key])}</span>
              <span class="opt-icon">${icon}</span>
            </button>
          `;
        });

        card.innerHTML = `
          <div class="mcq-header">
            <span class="q-badge">Question #${item.id}</span>
            ${statusHtml}
          </div>
          <div class="question-text">${escapeHTML(item.q)}</div>
          <div class="options-list">${optionsHtml}</div>
        `;

        fragment.appendChild(card);
      });

      if (!fragment.childNodes.length) {
        quizContainer.innerHTML = '<div class="mcq-card" style="text-align:center;color:var(--text-secondary);">No matching MCQs found.</div>';
      } else {
        quizContainer.appendChild(fragment);
      }
    }

    // Event delegation for instant option feedback
    quizContainer.addEventListener('click', (e) => {
      const btn = e.target.closest('.option-btn');
      if (!btn || btn.disabled) return;

      const id = Number(btn.dataset.id);
      const selected = btn.dataset.opt;
      const item = quizData.find(q => q.id === id);
      if (!item || userAnswers[id]) return;

      const isCorrect = selected === item.answer;
      userAnswers[id] = { selected, isCorrect };

      // Update current card immediately without losing scroll position
      const card = document.getElementById('mcq-' + id);
      const header = card.querySelector('.mcq-header');
      const existingStatus = header.querySelector('.q-status');
      if (existingStatus) existingStatus.remove();

      const statusSpan = document.createElement('span');
      statusSpan.className = 'q-status ' + (isCorrect ? 'ok' : 'bad');
      statusSpan.textContent = isCorrect ? '✔ Correct!' : `✘ Wrong (Correct: ${item.answer})`;
      header.appendChild(statusSpan);

      const allBtns = card.querySelectorAll('.option-btn');
      allBtns.forEach(b => {
        b.disabled = true;
        const optKey = b.dataset.opt;
        const iconEl = b.querySelector('.opt-icon');
        if (optKey === item.answer) {
          b.classList.add('correct-choice');
          iconEl.textContent = '✔';
        } else if (optKey === selected && !isCorrect) {
          b.classList.add('wrong-choice');
          iconEl.textContent = '✘';
        }
      });

      updateStats();
    });

    // Search & filter listeners
    searchInput.addEventListener('input', renderQuiz);
    filterSelect.addEventListener('change', renderQuiz);

    // Dark Mode Toggle with localStorage persistence
    function applyTheme(isDark) {
      document.body.classList.toggle('dark-mode', isDark);
      darkModeToggle.textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
      localStorage.setItem('waleed_quiz_dark_mode', isDark ? '1' : '0');
    }

    const savedTheme = localStorage.getItem('waleed_quiz_dark_mode');
    if (savedTheme === '1') {
      applyTheme(true);
    }

    darkModeToggle.addEventListener('click', () => {
      const isDark = !document.body.classList.contains('dark-mode');
      applyTheme(isDark);
    });

    // Reset Quiz
    resetQuizBtn.addEventListener('click', () => {
      if (Object.keys(userAnswers).length === 0) return;
      if (confirm('Are you sure you want to reset all your answers?')) {
        for (const k in userAnswers) delete userAnswers[k];
        updateStats();
        renderQuiz();
      }
    });

    // Scroll to Top button
    window.addEventListener('scroll', () => {
      scrollTopBtn.style.display = window.scrollY > 400 ? 'block' : 'none';
    });
    scrollTopBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // Initial render
    renderQuiz();
  </script>
